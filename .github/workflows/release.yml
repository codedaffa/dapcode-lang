name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: dapcodec-${{ github.ref_name }}-windows-x64.zip
            binary_name: dapcodec.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: dapcodec-${{ github.ref_name }}-linux-x64.tar.gz
            binary_name: dapcodec
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_name: dapcodec-${{ github.ref_name }}-macos-x64.tar.gz
            binary_name: dapcodec
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: dapcodec-${{ github.ref_name }}-macos-arm64.tar.gz
            binary_name: dapcodec

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/dapcodec.exe", "target/${{ matrix.target }}/release/dappkg.exe", "LICENSE", "README.md" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Unix Binary
        if: runner.os != 'Windows'
        run: |
          cp LICENSE README.md "target/${{ matrix.target }}/release/"
          tar -czf "${{ matrix.archive_name }}" -C "target/${{ matrix.target }}/release" dapcodec dappkg LICENSE README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  package-extension:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VSIX
        run: |
          cd editors/vscode
          npx -y @vscode/vsce package --no-dependencies -o dapcode-lang.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapcode-lang.vsix
          path: editors/vscode/dapcode-lang.vsix

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, package-extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
