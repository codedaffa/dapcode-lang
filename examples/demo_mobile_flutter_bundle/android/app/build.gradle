plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dapcode.demo_mobile_flutter'
    compileSdk 34

    defaultConfig {
        applicationId "com.dapcode.demo_mobile_flutter"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
