<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DapCode WebAssembly Runner - demo_kanvas</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(148, 163, 184, 0.15);
            --primary: #38bdf8;
            --accent: #818cf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 800px; }
        .header { margin-bottom: 2rem; }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--muted); font-size: 1.05rem; }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-group { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; }
        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45); }
        button.btn-clear { background: rgba(51, 65, 85, 0.8); box-shadow: none; border: 1px solid var(--border); }
        button.btn-clear:hover { background: #334155; }
        #terminal {
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 0.75rem;
            padding: 1.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            min-height: 220px;
            white-space: pre-wrap;
            color: #4ade80;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">WebAssembly (WASM) 1.0 MVP</span>
            <h1>DapCode Web Runner</h1>
            <p class="subtitle">Modul biner <code>demo_kanvas.wasm</code> dijalankan secara native di mesin peramban web Anda.</p>
        </div>

        <div class="card">
            <div class="btn-group">
                <button id="btn-run">▶ Jalankan Program</button>
                <button id="btn-clear" class="btn-clear">Bersihkan Konsol</button>
            </div>
            <div id="terminal">[Sistem] Menunggu inisialisasi WebAssembly...</div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            terminal.textContent += `\n[${time}] ${msg}`;
        }

        let wasmInstance = null;
        let memory = null;

        async function initWasm() {
            try {
                terminal.textContent = '[Sistem] Memuat demo_kanvas.wasm ...';
                const resp = await fetch('demo_kanvas.wasm');
                const bytes = await resp.arrayBuffer();

                const importObject = {
                    env: {
                        cetak_u64: (val) => log('Output: ' + val.toString()),
                        cetak_f64: (val) => log('Output: ' + val.toString()),
                        cetak_teks: (ptr, len) => {
                            const arr = new Uint8Array(memory.buffer, ptr, len);
                            log('Cetak: ' + new TextDecoder().decode(arr));
                        },
                        sin: Math.sin,
                        cos: Math.cos,
                        tan: Math.tan,
                        asin: Math.asin,
                        acos: Math.acos,
                        atan: Math.atan,
                        atan2: Math.atan2,
                        akar_kubik: Math.cbrt,
                        pangkat: Math.pow,
                        log: Math.log,
                        log10: Math.log10,
                        log2: Math.log2,
                        exp: Math.exp,
                        tanda: Math.sign,
                        kanvas_bersihkan: (r, g, b, a) => log('[Kanvas] Bersihkan (' + r + ', ' + g + ', ' + b + ', ' + a + ')'),
                        kanvas_warna_isi: () => undefined,
                        kanvas_warna_garis: () => undefined,
                        kanvas_tebal_garis: () => undefined,
                        kanvas_persegi: (x, y, w, h) => log('[Kanvas] Persegi (' + x + ', ' + y + ', ' + w + ', ' + h + ')'),
                        kanvas_bingkai_persegi: () => undefined,
                        kanvas_lingkaran: (x, y, rad) => log('[Kanvas] Lingkaran (' + x + ', ' + y + ', r=' + rad + ')'),
                        kanvas_bingkai_lingkaran: () => undefined,
                        kanvas_garis: () => undefined,
                        kanvas_titik: () => undefined,
                        kanvas_teks: (ptr, len, x, y) => {
                            const arr = new Uint8Array(memory.buffer, ptr, len);
                            log('[Kanvas Teks] "' + new TextDecoder().decode(arr) + '" pada (' + x + ', ' + y + ')');
                        },
                        kanvas_lebar: () => 800.0,
                        kanvas_tinggi: () => 600.0,
                    }
                };

                const { instance } = await WebAssembly.instantiate(bytes, importObject);
                wasmInstance = instance;
                memory = instance.exports.memory;
                window.dapInstance = instance;

                log('Sukses: Modul WebAssembly siap!');
                const exportNames = Object.keys(instance.exports).filter(k => k !== 'memory');
                log('Ekspor yang tersedia: ' + exportNames.join(', '));

                if (instance.exports.utama) {
                    log('Mengeksekusi fungsi utama()...');
                    const ret = instance.exports.utama();
                    if (ret !== undefined) log('Nilai Kembali utama(): ' + ret);
                }
            } catch (err) {
                log('Galat: ' + err.message);
            }
        }

        document.getElementById('btn-run').addEventListener('click', () => {
            if (wasmInstance && wasmInstance.exports.utama) {
                log('Mengeksekusi ulang fungsi utama()...');
                const ret = wasmInstance.exports.utama();
                if (ret !== undefined) log('Nilai Kembali utama(): ' + ret);
            } else {
                initWasm();
            }
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            terminal.textContent = '[Konsol dibersihkan]';
        });

        initWasm();
    </script>
</body>
</html>
